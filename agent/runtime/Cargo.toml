[package]
name = "catnip-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
rig-core = { version = "=0.44.0", default-features = false, features = ["reqwest", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
http = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
